[package]
name = "message-service"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures-util = "0.3.33"
hex = "0.4.3"
hkdf = "0.13.0"
jsonwebtoken = "10.3.0"
redis = { version = "1.5.0", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
